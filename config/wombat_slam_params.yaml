# SLAM Toolbox configuration for the wombat namespace.
# The launch file places these names under /wombat and remaps the map and TF
# topics, while these frame names remain relative to that namespace.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping

    # Frames and sensor topic used to build the map from the robot's motion.
    solver_plugin: solver_plugins::CeresSolver
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: scan

    # Map resolution and update timing trade map detail against computation.
    resolution: 0.05
    max_laser_range: 20.0
    transform_publish_period: 0.02
    map_update_interval: 5.0
    minimum_time_interval: 0.5
    throttle_scans: 1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Scan matching estimates motion between laser scans; loop closing reduces
    # accumulated drift when the robot revisits a previously mapped area.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true